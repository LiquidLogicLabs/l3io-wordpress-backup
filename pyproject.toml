[project]
name = "l3io-wordpress-backup"
# The version is the git tag (AD-30): hatch-vcs derives it at build time and
# `__version__` reads it back from the installed metadata. There is no literal
# here or in the package to drift from the tag. See [tool.hatch.version].
dynamic = ["version"]
description = "WordPress backup, restore and relocation for automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Anderson", email = "ravensorb@gmail.com" }]
keywords = ["wordpress", "backup", "restore", "migration", "mysqldump", "wp-cli"]
# ADR-0012 buys back the discoverability the namespace name gives up: the
# classifiers and keywords carry the function the distribution name no longer does.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

# Core stays PyPI-resolvable. `opentelemetry-api` is a hard dependency on purpose:
# it is one transitive dependency and ~0.7MB, and already ships the no-op
# ProxyTracer/NonRecordingSpan, so putting it behind an extra would oblige us to
# hand-roll a shim (AD-24, ADR-0011).
dependencies = [
  "structlog>=26.1,<27",
  "opentelemetry-api>=1.40,<2",
  # AD-19: the per-user state directory (the Site Lock's `locks/`, later Epic 3's
  # snapshots and Run Journal). Resolving XDG/macOS conventions by hand is the
  # domain the global rules forbid hand-rolling; zero dependencies, MIT.
  # Accepted by Shawn 2026-10-20 (E002-S02-008). Latest at adoption: 4.14.3.
  "platformdirs>=4.3,<5",
  # FR-5: gitignore-style exclusion patterns (`core/exclusions.py`, E004-S01-001).
  # Glob matching is a domain the global rules forbid hand-rolling; pure Python,
  # no dependencies of its own, ships `py.typed`, MPL-2.0. Only its string
  # matcher is used, never its tree-walking helpers. Latest at adoption: 1.1.1.
  "pathspec>=1.1,<2",
  # FR-27/AD-13: tool version parsing and comparison in `adapters/preflight.py`,
  # and `Requires-Dist` parsing for the diagnostic's extras (E005-S01-002).
  # Version comparison is a domain the global rules forbid hand-rolling; no
  # dependencies of its own, Apache-2.0 OR BSD-2-Clause. Orchestrator decision
  # 2026-11-06 (E005 gate G12), under the owner's global rule 1: version
  # comparison is not hand-rolled. Latest at adoption: 26.3.
  "packaging>=25,<27",
]

[project.optional-dependencies]
# Family-internal dependencies are extras, not core, for one reason: until every
# package beneath this one is publicly resolvable, a hard dependency makes the
# base install unresolvable in a clean environment — which is AD-15's gate
# correctly refusing, not a CI defect. Matches the arrangement in
# l3io-wordpress-database, which carries l3io-wordpress-config the same way.
#
# REVERT CONDITION: when l3io-wordpress-database is publicly resolvable from the index a
# consumer uses, this moves back into `dependencies` and the base-install check
# below stops forbidding it.
# l3io-wordpress-database: the API this rewrite builds on -- dump/load, survey,
# ensure, drop_database, CredentialChain and age encryption -- released at v0.1.0
# (2026-10-20); passphrase= arrived in v0.2.0 (ADR-0014). v0.2.1 (2026-11-03) is
# the same source as v0.2.0 (`git diff v0.2.0 v0.2.1 -- src/` is empty) and the
# first database release on TestPyPI; its published metadata names config and the
# binder by version range, not by git. Its `encryption` extra is taken
# (E004-S01-003, ADR-0024): it brings pyrage and the l3io-age-passphrase binder,
# which also comes from TestPyPI (named directly in the extra, with a source).
#
# STILL AN EXTRA, and the revert condition above is NOT met. TestPyPI is where the
# family resolves anonymously for development and CI (Shawn, 2026-11-02), but it
# is not an index a consumer already uses: a plain `pip install` searches PyPI
# only. The family moves to PyPI before backup's first real release; then this
# moves into `dependencies`.
#
# The NAMESPACE is unaffected: it imports as l3io.wp.database (docs/adr/0012).
# l3io-wordpress-config is named directly, not left to database's `wpconfig`
# extra, because restore writes wp-config.php through it (adapters/config_writer,
# AD-18) and v0.1.0's write widened the file's mode -- a 0640 file came back
# 0644, exposing DB_PASSWORD. v0.1.1 keeps mode and owner and fsyncs. v0.1.2 fixes
# four scanner defects PHP 8.4 confirmed on real configs: a define inside a
# multi-line comment read as live (wrong DB_NAME), DEFINE() in other cases
# unread, CRLF files rewritten as LF, and WpConfigString.set raising on CRLF
# (ADR-0023's OVERWRITE path). 0.1.3 is the same code with LiquidLogicLabs URLs,
# and is the first config release on TestPyPI. 0.1.4 adds WpConfigFile.replace_content,
# the atomic whole-file replace config_writer.replace_file calls (BL-E002-091).
# Nothing below 0.1.4 may be resolved.
# database 0.3.3 is the floor: its spans name a failure by class only
# (`error.type`, ERROR status with no description, no exception event), so no
# error text or stack leaves through them (BL-E006-010); and its `mysql`,
# `mysqldump` and `age` children get explicit minimal environments -- a
# sanitized absolute PATH and LC_ALL=C, plus HOME and AGE_PASSPHRASE_FD for an
# absolute-path `age` -- so no parent secret reaches them (BL-E004-055).
database = [
  "l3io-wordpress-database[encryption]>=0.3.3,<0.4",
  "l3io-wordpress-config>=0.1.4,<0.2",
  # Dependency inventory (FR-26, BL-E004-024), the two the `encryption` extra
  # brings:
  # - pyrage 1.4.0 (transitive, via database[encryption]): MIT. Present for age
  #   key-file encryption in database's stream functions; this package imports
  #   none of it (ADR-0014). 1.x, so no exit plan is needed.
  # - l3io-age-passphrase (below): MIT. Present for age passphrase encryption
  #   (the `binder` backend, ADR-0014 amendment 2026-10-27). PRE-1.0, so its
  #   exit plan is recorded: that amendment's own -- the `cli` backend (stock
  #   `age` >= 1.3 with age-plugin-batchpass) already works without it, and
  #   upstream pyrage gaining a streaming passphrase API
  #   (woodruffw/pyrage#171/#172) replaces it.
  # Named directly although database's `encryption` extra already requires it
  # (`<0.2,>=0.1.1` in 0.3.3's metadata): uv applies [tool.uv.sources] to
  # direct dependencies only -- in the lock, in `uv pip install -r
  # pyproject.toml` and in `uv run --with-editable` -- so without this line the
  # binder resolves from PyPI, where it is not published (E004-S01-003).
  "l3io-age-passphrase>=0.1.1,<0.2",
]
# FR-14 — AWS Secrets Manager credentials (E005-S01-001). database's own `aws`
# extra brings boto3 (`boto3<2,>=1.34` in 0.3.3's metadata), imported inside
# AwsSecretsManager.resolve(), so boto3 stays out of the base install.
aws = ["l3io-wordpress-database[aws]>=0.3.3,<0.4"]

# AD-8 — an optional dependency is an optional import. Nothing here may be
# imported at module scope; `verify-install` asserts a base install pulls none
# of it, against the built wheel in an isolated environment.
otel = [
  "opentelemetry-sdk>=1.40,<2",
  # AD-24: the umbrella `opentelemetry-exporter-otlp` is forbidden — it drags grpcio.
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
]

[project.urls]
Homepage = "https://github.com/LiquidLogicLabs/l3io-wordpress-backup"
Source = "https://github.com/LiquidLogicLabs/l3io-wordpress-backup"
Issues = "https://github.com/LiquidLogicLabs/l3io-wordpress-backup/issues"

[project.scripts]
wpbackup2 = "l3io.wp.backup.cli:run_from_cli"

# Development and CI only: `uv build --no-sources` keeps all of this out of the
# published metadata (ADR-0007). The family resolves from TestPyPI, anonymously,
# not from git and not from the family Gitea index (Shawn, 2026-11-02): that index
# needs a login, and this repository is public, so a clean clone or a fork's pull
# request has no token. TestPyPI is a stepping stone, not a release index -- the
# family moves to PyPI before backup's first real release, and these lines go.
[tool.uv.sources]
# v0.2.1 (2026-11-03): src identical to v0.2.0 (48a7da9).
l3io-wordpress-database = { index = "testpypi" }
# v0.1.3 (2026-11-03): src identical to v0.1.2 (e975ca6).
l3io-wordpress-config = { index = "testpypi" }
# The passphrase binder, required by database's `encryption` extra. uv applies
# [tool.uv.sources] to direct dependencies only, so the `database` extra names
# it (E004-S01-003).
l3io-age-passphrase = { index = "testpypi" }

# `explicit = true`: TestPyPI holds name-squatted and junk packages, so ONLY the
# packages named in [tool.uv.sources] are taken from it; everything else is PyPI.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv]
required-version = "==0.11.6"
# No `override-dependencies` for the passphrase binder (E004-S01-003): the
# `database` extra names it directly instead, the equivalent the story allows.
# An override also breaks CI's `uv pip install -r pyproject.toml --all-extras`
# check, which then resolves the binder from PyPI, where it is not published.

# PEP 735. `uv sync --dev` installs `dev`, which includes `test`.
#
# Trap 16: `uv run` syncs the DEFAULT groups only and PRUNES extras, so every
# `uv run` after a `uv sync --all-extras` silently uninstalls the extra and any
# test guarding it skips rather than runs. The optional dependencies are
# therefore repeated in `dev`. Optionality is still enforced where it counts —
# against the built wheel in an isolated environment, by `verify-install`.
[dependency-groups]
test = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  # The AD-27 namespace test builds a wheel and an sdist with the project's own
  # backend, in process, so it needs no network and no build-env resolution.
  # hatch-vcs must be here too, not only in build-system.requires: an in-process
  # hatchling cannot resolve `source = "vcs"` without it and fails with
  # `UnknownPluginError: Unknown version source: vcs`. Switching the version
  # source broke four namespace tests exactly this way.
  "hatchling>=1.32,<2",
  "hatch-vcs>=0.5,<1",
  # tests/contracts/test_workflow_invariants.py parses .github/workflows/*.yml.
  # A real YAML parser, not a regex: rule 1, and the workflow files are exactly
  # the kind of input where a hand-rolled parser silently disagrees with the
  # runner's own (a single U+0085 once silenced fourteen CI jobs that way).
  "PyYAML>=6.0,<7",
  # test_version_single_source compares PEP 440 ordering for the sentinel.
  "packaging>=25.0",
]
dev = [
  { include-group = "test" },
  "ruff==0.16.7",
  "mypy>=2.3.1,<3",
  "import-linter>=2.15,<3",
  "opentelemetry-sdk>=1.40,<2",
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
]

[tool.hatch.version]
# THE TAG IS THE VERSION. No literal in this file and none in the source, so
# there is nothing to keep in sync -- a better answer than the agreement test a
# second literal would need.
source = "vcs"

[tool.hatch.version.raw-options]
# Without this, a build off a non-tag commit carries a +g<sha> local segment,
# which PyPI and most indexes reject outright.
local_scheme = "no-local-version"
# Restrict the tag search to THREE-component v tags.
#
# This repo has no tags at all, so the stale-tag trap that hit
# py-wordpress-database -- a 2018 `v1.0` read as 1.1.dev39, which sorts ABOVE
# 1.0.0 and would have permanently outranked the real release -- cannot fire
# here yet. The guard is kept because it is the protection against the FIRST
# two-component tag anyone pushes; an untagged tree falls back to 0.1.devN,
# which sorts below everything. Wrong in the safe direction.
#
# `--dirty` has a consequence worth knowing, measured in a clone: at tag v1.0.0
# a CLEAN tree builds 1.0.0 and a DIRTY tree builds 1.0.1.dev0. So a modified
# working tree silently produces a dev version instead of the release. CI is
# safe (fresh checkout), but a local build used to verify a release is not --
# which is why `make release` must refuse on modified tracked files for
# CORRECTNESS, not tidiness.
#
# tests/contracts/test_version_single_source.py asserts this line is present: it
# is the least obvious line here and the likeliest to be deleted as noise.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# AD-27 — `packages` points at the namespace ROOT, and hatchling ships the
# directories beneath it without synthesising `__init__.py` markers. There is no
# `__init__.py` at src/l3io/ or src/l3io/wp/, and there never will be.
#
# `src/wpbackup2` is AD-22's `python -m wpbackup2`: a regular top-level package,
# outside the `l3io` namespace, whose `__main__` delegates to the console entry.
[tool.hatch.build.targets.wheel]
packages = ["src/l3io", "src/wpbackup2"]

# Hatchling's default sdist would sweep in the vendored agent tooling. Name the
# contents instead.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/README.md", "/LICENSE"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
# The agent tooling directories are vendored, not ours. The rest is the legacy
# 0.2.21 tree (the `legacy/wpbackup2/` package, its setuptools build, its tests
# and the README that documents it), moved out of the module name's way so
# `python -m wpbackup2` reaches the rewrite (AD-22, Shawn 2026-11-03) and kept on
# disk because the frozen-surface test reads its parser; it was never linted and
# is not the rewrite. test_legacy_test_exclusion guards that
# this list names nothing else.
extend-exclude = [
  "_bmad", "_bmad-output", ".claude", ".agents", ".bmad",
  "legacy/wpbackup2", "tests/classes", "setup.py", "test.py", "README.md",
]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # annotations — the spine requires a full annotation on every public surface
  "ARG",  # unused arguments (family set, aligned 2026-10-27)
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "EM",   # exception messages built outside the raise (family set)
  "F",    # pyflakes
  "I",    # import sorting
  "PT",   # pytest style
  "PTH",  # prefer pathlib over os.path
  "RUF",
  "S",    # bandit — this package shells out and handles credentials
  "SIM",
  "SLF",  # private member access
  "TID",  # tidy imports
  "TRY",  # exception-handling anti-patterns (family set)
  "UP",   # pyupgrade
  "W",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and the contract tests deliberately build hostile fixtures.
"tests/**" = ["S101", "S105", "S106", "S107", "ARG"]
# The gates are scripts: they print their findings and read files by path.
"tools/**" = ["S101"]
# Developer scripts run `git` and `gh` from PATH with fixed argument vectors.
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
# AD-27: `mypy --strict` on a PEP 420 namespace package suggests adding the
# `__init__.py` that breaks the sibling distributions. These three settings are
# the alternative, and the suggestion is never to be taken.
[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# tests/classes/ tests the legacy `legacy/wpbackup2` package, which imports `wpconfigr`
# and `wpdatabase2`; neither is in the lock, so collecting it fails the whole
# run. It also needs a live site and a tests/test_settings.json that is not in
# the repository. Kept on disk until AD-22's frozen surface decides what the
# legacy tree becomes. test_legacy_test_exclusion guards that nothing else is
# hidden by this.
addopts = "-ra --strict-markers --strict-config --ignore=tests/classes"
markers = [
  "integration: needs a live database, WordPress or WP-CLI (spine: a small integration tier, marked and separable)",
]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
# No `fail_under` is set. A threshold over a skeleton with no behaviour in it
# would be a number that passes for the wrong reason; it is set when there is
# something to cover, and that is a Stage 2 decision rather than a default
# inherited from now.
[tool.coverage.run]
source = ["l3io.wp.backup"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# --------------------------------------------------------------------------
# import-linter — AD-1, the module half
# --------------------------------------------------------------------------
# This covers what import-linter can see: module imports and the inward-facing
# layer rule. It CANNOT see builtins, so `open()`, a clock read through a
# re-export and RNG reads are outside its reach entirely — `tools/check_purity.py`
# carries those, and says so where it lives.
[tool.importlinter]
root_packages = ["l3io.wp.backup"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-1 — domain/ and core/ import no I/O module"
type = "forbidden"
source_modules = ["l3io.wp.backup.domain", "l3io.wp.backup.core"]
forbidden_modules = [
  "boto3",
  "cryptography",
  "gzip",
  "io",
  "opentelemetry",
  "os",
  "pymysql",
  "shutil",
  "socket",
  "sqlite3",
  "structlog",
  "subprocess",
  "tarfile",
  "tempfile",
  "urllib",
  "zipfile",
]

[[tool.importlinter.contracts]]
name = "AD-1 — the pure layers never face outward"
type = "forbidden"
source_modules = ["l3io.wp.backup.domain", "l3io.wp.backup.core"]
forbidden_modules = [
  "l3io.wp.backup.adapters",
  "l3io.wp.backup.api",
  "l3io.wp.backup.cli",
  "l3io.wp.backup.ports",
]

[[tool.importlinter.contracts]]
name = "AD-1 — layers run inward only"
type = "layers"
layers = [
  "l3io.wp.backup.cli : l3io.wp.backup.api",
  "l3io.wp.backup.adapters",
  "l3io.wp.backup.ports",
  "l3io.wp.backup.core",
  "l3io.wp.backup.domain",
]

# FR-24 (E006-S01-003): the layers contract lets the `cli : api` siblings import
# each other, but cli/ must never import api/ — the library root would become a
# CLI dependency, and the cycle would break a cold `import l3io.wp.backup.api`.
[[tool.importlinter.contracts]]
name = "FR-24 — cli/ never imports api/"
type = "forbidden"
source_modules = ["l3io.wp.backup.cli"]
forbidden_modules = ["l3io.wp.backup.api"]
