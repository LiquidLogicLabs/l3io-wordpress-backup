retrospective:
  summary: "E007 delivered site relocation end to end at the library level: URL and database relocation, WP-CLI search-replace over serialized data, config outside the site root, WP-CLI preflight. Epic-wide review found no critical issue; the fixes made in closure cover untrusted stored URLs, child timeout, /proc exposure, laid-down config mode and config shadowing. Preflight binding for the CLI is E008-S01-001's, now with acceptance criteria."
  learnings: A new call site on an existing trust boundary inherits the boundary's guard list, with a test per guard; state what a security control does not cover next to what it does; apply string rules to untrusted text where it enters argv whatever its origin; give every child process a time limit and output bound; mark deferred bindings 'not yet' in user-facing docs.
