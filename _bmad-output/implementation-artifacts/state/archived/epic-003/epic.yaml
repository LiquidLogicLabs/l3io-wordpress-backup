retrospective:
  summary: Epic E003 delivered six stories that make wpbackup2 restore real, covering the restore plan, the destructive-restore refusal, the Safety Snapshot, an honest database report, kill-safe staging with a Run Journal, and the end-to-end command. About a third of the epic's commits were closure and post-closure fixes, driven by security findings found late, including one Critical, and a post-closure pass then closed every High and Medium backlog item. The main lesson is to threat-review untrusted input and credential handling at the story that introduces it, and to test behaviour rather than prose.
  learnings: "- Run a threat pass at the first story that passes Archive content or a credential to an external process, not at sprint closure.\n- A guard must act on behaviour (code path, file mode, process arguments), not on help text or prose.\n- Record owner decisions as ADRs during story elaboration so they do not become open Medium backlog items.\n- Give every deferral a named owner story with amended acceptance criteria; unowned deferrals needed a separate fix pass.\n- Make the DB-backed integration suite and man-hour or cost capture mandatory closure steps."
