  title: 'Spec proposal: **What happens.** `core/verify.verify` selects a whole v1 or v0 rule set on `view.payload is None`. `payload` is `None` exactly when the Archive is v0, so this is a version branch under another name. The v0 rule set (`_v0`) then re-inspects the raw `MemberIndex` (`MANIFEST_MEMBER in index.names`). `adapters/tar` picks the extraction source and the kind checks the same way.<br>**Why the guard misses it.** The contract test matches only the token `format_version`. Its own "not covered" note names copied values, not proxies like this one. So the gate stays green over the branch AD-23 exists to prevent: two consumers, here `core/verify` and `adapters/tar`, each re-deriving the format.<br>**Status.** E002-S01-003:61 and :65 specify this placement, so the story text diverges from the spine. This is reported, not reopened.'
  source: spec-sync (SD-01-2)
  severity: Medium
  status: backlog
  kind: spec-proposal
  ref: _bmad-output/implementation-artifacts/epic-002/epic-closure/spec-proposals/SD-01-2.md
  description: 'Confirm or reject: /l3io-doctor triage. Spec: _bmad-output/planning-artifacts/architecture/architecture-py-wordpress-backup-2026-09-15/ARCHITECTURE-SPINE.md#ad-23--archive-format-detection-is-explicit-and-one-way. From: _bmad-output/implementation-artifacts/epic-002/sprint-01/closure/arch-drift-review.md.'
- key: BL-E002-107
  epic: '002'
  sprint: ''
  title: "Spec proposal: Each no-op command hard-codes the restore phase it belongs to. `adapters/phase.py::join_phase` joins only when the innermost open phase has that exact name; otherwise it opens a new phase and emits its own `phase_completed`. The AD-17 amendments (2026-10-20, 2026-10-27) put the `DB_*` cutover `set_constants` call inside `LOAD_DUMP`. AD-18.3 drops the database that loses the cutover after the load. So under the dry-run set, a cutover emits a `rewrite-config` record nested in `load-dump`, and a drop emits a `clean` record after `load-dump`. The real adapters emit no phase records at all. A Dry Run's phase sequence would then differ from the real Run's, and it would contradict the order that Epic 3's phase-sequence test asserts (\"no `DB_*` write precedes the end of the load\"). The adapter is deciding plan structure that belongs to the executor."
  source: spec-sync (SD-02-1)
  severity: Medium
  status: backlog
  kind: spec-proposal
  ref: _bmad-output/implementation-artifacts/epic-002/epic-closure/spec-proposals/SD-02-1.md
  description: 'Confirm or reject: /l3io-doctor triage. Spec: _bmad-output/planning-artifacts/architecture/architecture-py-wordpress-backup-2026-09-15/ARCHITECTURE-SPINE.md#ad-17--restore-phase-order-is-data-not-a-diagram. From: _bmad-output/implementation-artifacts/epic-002/sprint-02/closure/arch-drift-review.md.'
- key: BL-E002-108
  epic: '002'
  sprint: ''
  title: 'Spec proposal: The parser docstring states that AD-22 preserves `python -m wpbackup2`. In practice the legacy `wpbackup2/` tree occupies that module name and is excluded from the wheel, so the invocation does not reach the new parser. The contract test carries a strict xfail. It is tracked only as BL-E002-086 ("no story owns it yet"). This hard-rule deviation of the frozen contract has no owner and no ADR.'
  source: spec-sync (SD-02-2)
  severity: Medium
  status: backlog
  kind: spec-proposal
  ref: _bmad-output/implementation-artifacts/epic-002/epic-closure/spec-proposals/SD-02-2.md
  description: 'Confirm or reject: /l3io-doctor triage. Spec: _bmad-output/planning-artifacts/architecture/architecture-py-wordpress-backup-2026-09-15/ARCHITECTURE-SPINE.md#ad-22--the-cli-is-a-frozen-contract-the-python-api-is-not. From: _bmad-output/implementation-artifacts/epic-002/sprint-02/closure/arch-drift-review.md.'
- key: BL-E002-109
  epic: '002'
  sprint: ''
  title: "Spec proposal: Sprint 1 emitted the `phase` field in upper case (`DUMP`, `VERIFY`). Sprint 2 declared restore phases in lower-case kebab (`load-dump`, `rewrite-config`, `search-replace`), and the no-op twins already emit them as `phase` through `_skip(RestorePhase.X.value)`. `docs/logging.md:53` defines the field as \"The step: `DUMP`, `COLLECT_SITE_ROOT`, ... `PUBLISH`\" with a closed list, and `jq 'select(.event==\"phase_completed\")'` (logging.md:10) is the documented query. Epic 3's executor will therefore emit a second spelling in the same field, and `VERIFY` exists in both flows with different spellings (`VERIFY` from `BackupStep`, `verify` from `RestorePhase`). The spine writes AD-17's phases in upper case, so the lower-case values are not in the spec. Nothing is wrong yet, but the field is still unemitted by a real restore, so renaming now costs a docstring and a test; after Epic 3 it is a log-schema break."
  source: spec-sync (AD-1)
  severity: Medium
  status: backlog
  kind: spec-proposal
  ref: _bmad-output/implementation-artifacts/epic-002/epic-closure/spec-proposals/AD-1.md
