findings:
  SD-01-1:
    severity: MAJOR
    title: "**What happens.** `open_run` binds `run_id` through an `ExitStack` and resets it when the stack exits. The exception then propagates to `main`, and only there does `report_failure` emit `command_failed`. That record holds the operator message, `exit_code` and `exit_reason`. Because the stack has already exited, the record carries no `run_id`.<br>**What the Run's own records hold.** `run_finished` has the `run_id` but only `error=<class name>`. So the per-Run query the story promises returns a failed Run without the reason it failed. In a week-long JSON log of many Runs, the two records can be matched only by timestamp.<br>**Status.** `docs/logging.md:86-88` discloses the gap, and `closure/review-E002-S01-005.md:51` observed it. Neither is an owner decision that departs from AD-10."
    disposition: resolved-in-code
    spec:
    adr:
    commit:
    issue:
  SD-01-2:
    severity: MAJOR
    title: '**What happens.** `core/verify.verify` selects a whole v1 or v0 rule set on `view.payload is None`. `payload` is `None` exactly when the Archive is v0, so this is a version branch under another name. The v0 rule set (`_v0`) then re-inspects the raw `MemberIndex` (`MANIFEST_MEMBER in index.names`). `adapters/tar` picks the extraction source and the kind checks the same way.<br>**Why the guard misses it.** The contract test matches only the token `format_version`. Its own "not covered" note names copied values, not proxies like this one. So the gate stays green over the branch AD-23 exists to prevent: two consumers, here `core/verify` and `adapters/tar`, each re-deriving the format.<br>**Status.** E002-S01-003:61 and :65 specify this placement, so the story text diverges from the spine. This is reported, not reopened.'
    disposition: spec-proposal
