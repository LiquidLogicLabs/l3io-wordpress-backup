rationale: |
  Reorg proposal — 0 retirements, 1 story re-placed (accepted by Shawn, 2026-10-27).
  WHY
    The dependency extraction for /l3io-plan step 05 found two sprint-1 stories depending on
    a sprint-2 one: E002-S01-004 (Run Context) installs E002-S02-004's redact_event in its
    logging chain, and E002-S01-005 (exit codes) translates the AWS credential flags through
    E002-S02-004's wordpress_source. Story 2.4 had stayed in sprint 2 because ADR-0015 removed
    its transport dependency; this dependency is a different one.
  MOVES
    Moves: E002-S02-004 "Supply credentials without exposing them" -> E002 sprint 01 (re-keyed)
    Stays: everything else in E002, and all of E003-E008.
    Untouched: no epic is active or archived.
