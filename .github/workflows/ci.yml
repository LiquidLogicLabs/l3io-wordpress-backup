# l3io-wordpress-backup CI.
#
# Every mechanical gate the architecture spine relies on runs here, and every
# job in this file also runs locally under nektos/act with no edits. Publishing
# lives in publish.yml, which act never runs — act ignores `job.permissions`
# and has no OIDC, so a guard expression would not protect it. File separation
# is the only reliable boundary.
#
# Gates on vars.LOCAL_ACT, never env.ACT: env.ACT does not work in a job-level
# `if:`, and Gitea's runners also set ACT=true.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # act binds the developer's real checkout and runs as root, so ANYTHING the run
  # writes into the tree is left root-owned — not just the venv and build output,
  # but bytecode caches too, which then break `make clean` with EACCES. Redirect
  # every write path out of the workspace. Harmless on GitHub, where the job owns
  # its own VM.
  PYTHONPYCACHEPREFIX: ${{ vars.LOCAL_ACT && '/tmp/l3io-cache/pycache' || '' }}
  MYPY_CACHE_DIR:      ${{ vars.LOCAL_ACT && '/tmp/l3io-cache/mypy'    || '.mypy_cache' }}
  RUFF_CACHE_DIR:      ${{ vars.LOCAL_ACT && '/tmp/l3io-cache/ruff'    || '.ruff_cache' }}
  PYTEST_ADDOPTS:      ${{ vars.LOCAL_ACT && '-p no:cacheprovider'     || '' }}

# No UV_FROZEN here: uv rejects `--locked` when it is set, and ADR-0007 specifies
# --locked because it asserts the lockfile is current rather than merely using it.

jobs:
  static:
    name: lint · format · types
    runs-on: ubuntu-latest
    env:
      # act binds the developer's real checkout as the workspace and runs as root,
      # so a venv inside it is shared across parallel matrix jobs and left
      # root-owned afterwards. Keep every environment outside the tree.
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-static
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 on EVERY checkout, not only the jobs that build.
          # A dynamic version read from git means `uv run` builds the package, so
          # even a lint-only job versions an artifact -- and actions/checkout
          # defaults to depth 1 with NO TAGS, which makes setuptools-scm fall back
          # to 0.1.dev1 and the job pass GREEN with a misversioned build. Applied
          # uniformly because which jobs build is a fact that changes.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          enable-cache: ${{ !vars.LOCAL_ACT }}
      - run: uv sync --locked --all-extras --dev
      - name: ruff lint
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy --strict src

  contracts:
    name: architecture contracts
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 on EVERY checkout, not only the jobs that build.
          # A dynamic version read from git means `uv run` builds the package, so
          # even a lint-only job versions an artifact -- and actions/checkout
          # defaults to depth 1 with NO TAGS, which makes setuptools-scm fall back
          # to 0.1.dev1 and the job pass GREEN with a misversioned build. Applied
          # uniformly because which jobs build is a fact that changes.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          enable-cache: ${{ !vars.LOCAL_ACT }}
      - run: uv sync --locked --all-extras --dev

      # AD-1 — domain/ and core/ stay pure. import-linter covers module
      # imports; it cannot see builtins, so the AST check carries open()/clock/RNG.
      - name: AD-1 layer contract
        run: uv run lint-imports

      - name: AD-1 purity (builtins import-linter cannot see)
        run: uv run python tools/check_purity.py

      # AD-4 — Dry Run is adapter selection. A conditional anywhere outside a
      # composition root is the defect this gate exists to catch. The exemption
      # is anchored to the two roots by path: --exclude-dir would match a
      # directory named cli/ or api/ at any depth. The pattern is
      # case-insensitive with no word boundary, so compound and camel spellings
      # (self._dry_run, dry_run_flag, isDryRun, whatIf) are caught too.
      # Hyphenated `--dry-run` is not an identifier (wp-cli's own flag) and is
      # not matched. Two whole tokens are allowed outside the roots: the
      # persisted phase outcome value `skipped_dry_run` (adapters/phase.py) and
      # the root function `dry_run_adapters` named in docstrings; the sed strips
      # only those tokens, so any other spelling on the same line still fires.
      - name: AD-4 no dry-run conditionals
        run: |
          # AD-12: assert the scope first. A missing path makes the first grep
          # exit 2 and the last one see no input, so the step would pass
          # over nothing.
          test -d src/l3io/wp/backup || {
            echo "::error::AD-4 -- src/l3io/wp/backup does not exist; this guard would pass vacuously"
            exit 1
          }
          if grep -rniE 'dry_?run|what_?if' src/l3io/wp/backup --include='*.py' \
               | grep -vE '^src/l3io/wp/backup/(cli|api)/' \
               | sed -E 's/\b(skipped_dry_run|dry_run_adapters)\b//g' \
               | grep -iE 'dry_?run|what_?if'; then
            echo "::error::AD-4 — dry-run conditional outside a composition root"
            exit 1
          fi

      # AD-5 — no function consuming a RestoreMode may default it. This is the
      # invariant that maps to the unconditional-rmtree data loss.
      - name: AD-5 no defaulted RestoreMode
        run: uv run python tools/check_mode_defaults.py

      # AD-25 — scope derived from the parser itself, so a flag added without a
      # mapping fails here rather than falling into an implicit default.
      - name: AD-25 flag map is total
        run: uv run pytest tests/contracts/test_flag_map.py -q

      # AG-25 / FR-21 — the README's CLI usage and exit-code table are generated
      # from the parser and the ExitCode enum; drift fails here.
      - name: AG-25 generated CLI docs are current
        run: uv run python tools/gen_cli_docs.py --check

      # AD-27 -- the namespace guard, checked HERE and not only at publish time.
      # This is a PEP 420 native namespace package: `src/l3io/` and `src/l3io/wp/`
      # must contain no `__init__.py`, because one there shadows the namespace and
      # makes the sibling distributions (l3io-wordpress-config, l3io-wp-database)
      # unimportable alongside this one. Until now that was only checked in
      # publish.yml, so a namespace break reached a release rather than the pull
      # request that introduced it -- the worst possible moment to find it.
      #
      # `find` rather than trusting the import test: a marker file added anywhere
      # above the area package fails here too, not only the one the test imports.
      - name: AD-27 no namespace marker files
        run: |
          set -euo pipefail
          # Assert the SCOPE before asserting the rule. Without this, `find` on a
          # missing src/l3io writes to stderr, puts nothing on stdout, and the
          # `grep -q .` below matches nothing -- so the guard REPORTS SUCCESS over
          # an empty set. That is the vacuous-guard failure: the same passing step
          # means "no marker files" in one tree and "no tree at all" in another,
          # and the difference is invisible from the log.
          if [ ! -d src/l3io ]; then
            echo "::error::AD-27 -- src/l3io does not exist; this guard would pass vacuously"
            exit 1
          fi
          if find src/l3io -maxdepth 2 -name '__init__.py' | grep -q .; then
            echo "::error::AD-27 -- __init__.py above src/l3io/wp/backup/ shadows the namespace"
            find src/l3io -maxdepth 2 -name '__init__.py'
            exit 1
          fi

  test:
    name: py${{ matrix.python }} · ${{ matrix.engine.name }}
    runs-on: ubuntu-latest
    # The FULL grid runs under act too (2026-11-08). It used to collapse to one
    # leg, because act runs a job container on `--network host`, so every leg's
    # service published host port 3306 and eleven of twelve failed with "port is
    # already allocated". That collapse is how the mariadb legs went red on GitHub
    # with `make ci` green: no local run ever started MariaDB.
    #
    # The fix is network isolation, not fewer legs. act gives every job that has
    # `services:` its own network, with the service aliased `db`, but it attaches
    # the JOB container to that network only when the job declares `container:`
    # (act v0.2.89, pkg/runner/run_context.go). So under act the job runs in the
    # same image ~/.actrc maps ubuntu-latest to, in its own network namespace,
    # reaches its own database as db:3306 (forwarded to 127.0.0.1:3306 by a
    # step below), and no leg publishes a fixed host port.
    #
    # On GitHub the expression is '', which the runner treats as "no container"
    # (PipelineTemplateConverter.ConvertToJobContainer returns null for an empty
    # literal), so GitHub legs still run on the VM and reach 127.0.0.1:3306.
    # Override the image with vars.ACT_JOB_IMAGE in .act.vars if ~/.actrc maps
    # ubuntu-latest elsewhere.
    container: ${{ vars.LOCAL_ACT && (vars.ACT_JOB_IMAGE || 'ghcr.io/catthehacker/ubuntu:act-latest') || '' }}
    defaults:
      run:
        # A job with `container:` defaults to `sh`; pin bash so both places run
        # these steps under the same shell.
        shell: bash
    strategy:
      fail-fast: false
      # act runs 4 legs of a matrix at a time unless told otherwise, so the 12
      # database legs went in three waves and set the floor of `make ci` once
      # the tier split made each leg short. Six under act is two waves (see the
      # Makefile's ACT_CONCURRENT_JOBS note for the measurement); every leg at
      # once on GitHub, which is its default.
      max-parallel: ${{ vars.LOCAL_ACT && 6 || 12 }}
      matrix:
        # No `include:` here, deliberately. An include entry whose keys do not match
        # an existing combination ADDS a leg rather than extending one. Carrying
        # image and health on the engine object keeps each engine one value.
        python: ["3.11", "3.12", "3.13", "3.14"]
        engine:
          - { name: mysql80, image: "mysql:8.0", health: "mysqladmin ping -h 127.0.0.1 -uroot -proot" }
          - { name: mysql84, image: "mysql:8.4", health: "mysqladmin ping -h 127.0.0.1 -uroot -proot" }
          - { name: mariadb, image: "mariadb:11.4", health: "healthcheck.sh --connect --innodb_initialized" }
    services:
      db:
        image: ${{ matrix.engine.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wptest
        # GitHub: a fixed host port, because the job runs on the VM. act: the
        # container port only (Docker picks an unused host port), because the
        # job reaches the service over the per-job network and twelve legs must
        # not contend for one host port.
        ports: ["${{ vars.LOCAL_ACT && '3306' || '3306:3306' }}"]
        options: >-
          --health-cmd="${{ matrix.engine.health }}"
          --health-interval=5s --health-timeout=5s
          --health-retries=20 --health-start-period=30s
    env:
      # 127.0.0.1 on BOTH GitHub and act, and it must stay a loopback address:
      # wpbackup2 treats any other DB_HOST as remote (it wants --confirm-db-host
      # and verifies the server's TLS certificate), so `db` would test a
      # different code path from GitHub's. GitHub publishes the service port on
      # the VM's loopback; under act the "forward the database" step below does
      # the same inside each leg's own container.
      DB_HOST: ${{ vars.DB_HOST || '127.0.0.1' }}
      DB_PASSWORD: root
      # Coverage output is the third thing act leaves root-owned in the bound
      # workspace (after the venv and the build output), and it breaks `make clean`
      # for the developer afterwards. Redirect both the data file and the report.
      COVERAGE_FILE: ${{ vars.LOCAL_ACT && '/tmp/l3io-coverage/.coverage' || '.coverage' }}
      COVERAGE_XML: ${{ vars.LOCAL_ACT && '/tmp/l3io-coverage/coverage.xml' || 'coverage.xml' }}
      # One environment per matrix leg, outside the bound workspace. `runner.temp`
      # cannot be used in a job-level env block — the runner context is step-level
      # only and act's schema validator rejects it — but `matrix` is available here.
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-py${{ matrix.python }}-${{ matrix.engine.name }}
      # Python itself outside root's home. Under act every job runs as root, and
      # setup-uv then installs the interpreter in /root (mode 0700); a test's
      # `wpbackup2` child started as root switches to the Site's owner (owner
      # decisions 58, 67), which could not read the standard library and is
      # refused with InstallationNotReadableError. /tmp is readable by anyone
      # on both act and GitHub (whose default is RUNNER_TEMP anyway).
      UV_PYTHON_INSTALL_DIR: /tmp/l3io-python
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 on EVERY checkout, not only the jobs that build.
          # A dynamic version read from git means `uv run` builds the package, so
          # even a lint-only job versions an artifact -- and actions/checkout
          # defaults to depth 1 with NO TAGS, which makes setuptools-scm fall back
          # to 0.1.dev1 and the job pass GREEN with a misversioned build. Applied
          # uniformly because which jobs build is a fact that changes.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
          enable-cache: ${{ !vars.LOCAL_ACT }}
      - name: install mysql client and WP-CLI
        env:
          WP_CLI_VERSION: "2.12.0"
          WP_CLI_SHA512: "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mysql-client php-cli php-mysql php-zip
          # Pinned and checksummed (2026-10-27). The gh-pages "latest" phar moved under
          # every run, and story E007-S01-004 makes this version the supported minimum.
          # The sha512 is the release's own published value, hardcoded here because a
          # checksum fetched beside the file proves nothing about the file.
          curl -sSLo /tmp/wp "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar"
          echo "${WP_CLI_SHA512}  /tmp/wp" | sha512sum -c -
          sudo install -m 0755 /tmp/wp /usr/local/bin/wp
          wp --info --allow-root
      # act only. The job container has its own network namespace (see
      # `container:` above), so 127.0.0.1 is this leg's alone; forward it to the
      # leg's own service, `db` on the per-job network, so DB_HOST is the same
      # loopback address it is on GitHub. socat is the stock tool for this.
      - name: forward the database to 127.0.0.1:3306 (act only)
        if: ${{ vars.LOCAL_ACT }}
        run: |
          sudo apt-get install -y --no-install-recommends socat
          nohup setsid socat TCP-LISTEN:3306,bind=127.0.0.1,fork,reuseaddr TCP:db:3306 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null && exit 0
            sleep 1
          done
          echo "::error::the forward to db:3306 did not come up"; exit 1
      # Gate E004 AG-4 (E004-S01-003): stock `age` for the interop test, and the
      # `cli` passphrase backend database falls back to. Ubuntu's apt `age` is below
      # 1.3 and `age-plugin-batchpass` is not packaged, so the release is pinned and
      # checksummed; the sha256 is the release's own published asset digest,
      # hardcoded because a checksum fetched beside the file proves nothing about it.
      - name: install age
        env:
          AGE_VERSION: "1.3.2"
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
        run: |
          curl -sSLo /tmp/age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  /tmp/age.tar.gz" | sha256sum -c -
          mkdir -p /tmp/age
          tar -xzf /tmp/age.tar.gz -C /tmp/age --strip-components=1
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /tmp/age/age-inspect /usr/local/bin/
          age --version
      - run: uv sync --locked --all-extras --dev
      # THE DATABASE TIER ONLY (2026-11-09). Each leg used to run the whole suite,
      # ~6,000 tests, to exercise the ~160 that need a database, so the twelve
      # legs repeated the `unit` job's work twelve times over and `make ci` took
      # ~90 minutes. The two tiers are complements -- `-m integration` here,
      # `-m "not integration"` in `unit`, on the same Pythons -- so every test
      # still runs on every interpreter, and every integration test on every
      # engine. What keeps the split honest:
      #   - tests/contracts/test_integration_marker_reach.py: a test that needs
      #     the database (derived from the DB fixtures, DB_HOST reads and skips)
      #     and is not marked `integration` would run in NO leg; it fails there;
      #   - tests/conftest.py: with CI set an `integration` test that skips
      #     FAILS, so a leg that lost its database cannot pass by skipping;
      #   - tests/contracts/test_workflow_invariants.py: this job selects exactly
      #     `-m integration`, `unit` exactly the complement, on equal Pythons.
      # Coverage is measured in both tiers; see `unit`.
      - name: pytest (database tier)
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          uv run pytest -q -m integration --cov=l3io.wp.backup \
            --cov-report=term-missing --cov-report=xml:"$COVERAGE_XML"

  unit:
    # Every supported interpreter, no database: everything not marked
    # `integration`, the complement of the `test` job's selection. Added while
    # the `test` job's matrix still shrank to one leg under act, after a
    # regression on a newer CPython passed `make ci` locally: tarfile in
    # 3.13/3.14 stopped calling TarInfo.frombuf, so the E004 header bound was
    # bypassed there (E004 closure follow-up, 2026-11-06).
    name: unit+contracts · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-unit-py${{ matrix.python }}
      # Readable by the Site's owner a root test's child switches to: see `test`.
      UV_PYTHON_INSTALL_DIR: /tmp/l3io-python
      # Out of the bound workspace under act, as in `test`.
      COVERAGE_FILE: ${{ vars.LOCAL_ACT && '/tmp/l3io-coverage/.coverage' || '.coverage' }}
      COVERAGE_XML: ${{ vars.LOCAL_ACT && '/tmp/l3io-coverage/coverage.xml' || 'coverage.xml' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
          enable-cache: ${{ !vars.LOCAL_ACT }}
      # The same pinned, checksummed age as the `test` job: the interop test
      # fails rather than skips when CI is set.
      - name: install age
        env:
          AGE_VERSION: "1.3.2"
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
        run: |
          curl -sSLo /tmp/age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  /tmp/age.tar.gz" | sha256sum -c -
          mkdir -p /tmp/age
          tar -xzf /tmp/age.tar.gz -C /tmp/age --strip-components=1
          sudo install -m 0755 /tmp/age/age /tmp/age/age-plugin-batchpass /tmp/age/age-inspect /usr/local/bin/
          age --version
      - run: uv sync --locked --all-extras --dev
      # Coverage moved here with the tests it measures (2026-11-09). It was
      # measured over the whole suite in each database leg; now each leg
      # measures the tier it runs, so per Python the two reports together cover
      # what the one did. There is no threshold (pyproject.toml: no
      # `fail_under`) and nothing consumes the XML, so no gate changed; what is
      # lost is a single combined percentage, which would need the two jobs'
      # data files in one place -- upload-artifact@v7 does not run under act.
      #
      # Spread over the cores with pytest-xdist (2026-11-09). Serial, this tier
      # was the long pole of `make ci`: ~10 CPU-minutes per leg, stretched to
      # 15-26 minutes when four legs and the database legs shared the host.
      # `-n auto` uses every core a GitHub runner has; --maxprocesses caps it
      # under act, where each of the four legs sees all of the host's cores.
      # The database tier stays serial: its tests share one server.
      - name: pytest (no database)
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          uv run pytest -q -n auto --maxprocesses=4 -m "not integration" \
            --cov=l3io.wp.backup \
            --cov-report=term-missing --cov-report=xml:"$COVERAGE_XML"

      # AD-11 — an archive is untrusted input. filter='data' is guarded by
      # hasattr because 3.11 only has it patch-level-dependently via backport.
      # Named gates, run here because they need every Python and no database:
      # they used to follow the full suite in the database legs.
      - name: AD-11 extraction containment
        run: uv run pytest tests/contracts/test_extraction.py -q

      # AD-21 — peak RSS bounded by a constant independent of archive size.
      - name: AD-21 streaming bound
        run: uv run pytest tests/contracts/test_streaming.py -q

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [static, contracts, test, unit]
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-build
      # act binds the real checkout and runs as root, so build OUTPUT is left
      # root-owned too and the next local `make build`/`make clean` fails with
      # EACCES. UV_PROJECT_ENVIRONMENT only protects the venv.
      DIST_DIR: ${{ vars.LOCAL_ACT && '/tmp/l3io-dist' || 'dist' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      - run: uv build --no-sources --out-dir "$DIST_DIR"
      - name: upload the distributions
        # act's artifact server rejects upload-artifact@v7 outright — it does not
        # speak v7's protocol ("unknown field mime_type"). v4 DOES round-trip under
        # act today, but runs on Node 20, which leaves the GitHub runner images on
        # 2026-09-23. So neither major can serve a gate that must run in both places:
        # v7 cannot run locally, v4 stops running remotely next week. This upload is
        # therefore for release and inspection only — NOTHING depends on it, and
        # verify-install builds its own wheel instead.
        if: ${{ !vars.LOCAL_ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ env.DIST_DIR }}/
          if-no-files-found: error

  verify-install:
    # FR-25 / AD-15. Installs a BUILT WHEEL into a clean isolated environment.
    # Installing the working tree would have passed throughout the entire period
    # when the published package could not resolve — that is the blind spot this
    # closes, and it is satisfied by any freshly built wheel, not specifically by
    # the bytes `build` uploaded. So this job builds its own rather than consuming
    # an artifact, which is what lets it run under act as well as on GitHub. The
    # most dangerous invariant should not be the one with no local coverage.
    #
    # If the PUBLISHED bytes ever need verifying specifically, that is a separate
    # GitHub-only job and must be labelled as such rather than pretending to be
    # locally runnable.
    name: clean install · py${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: [static, contracts]
    strategy:
      fail-fast: false
      matrix:
        # Full axis under act too (aligned 2026-10-27): this job starts no services,
        # so its legs cannot collide on a host port, and collapsing it only stopped
        # act from checking the versions it exists for. Checked by
        # scripts/check-cicd-alignment.py.
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-verify-py${{ matrix.python }}
      DIST_DIR: ${{ vars.LOCAL_ACT && format('/tmp/l3io-dist-verify-py{0}', matrix.python) || 'dist-verify' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
      - name: build the distributions under test
        run: uv build --no-sources --out-dir "$DIST_DIR"
      - name: install the wheel into an isolated environment and import it
        run: |
          set -euo pipefail
          wheel=$(ls "$DIST_DIR"/*.whl)
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" \
                 python -c "from l3io.wp import backup; import sys; print('import ok', sys.version)"
      - name: base install has the family and pulls no optional dependency
        # Owner decision 76 and AD-8: the base install backs up and restores
        # (every base requirement met, the family included, l3io.wp.database
        # and l3io.wp.config import) and pulls nothing only an extra brings
        # (boto3 through `aws`, the OpenTelemetry SDK through `otel`). Both
        # sets are read from the installed wheel's own metadata by
        # tools/check_base_install.py; nothing is listed here.
        run: |
          set -euo pipefail
          wheel=$(ls "$DIST_DIR"/*.whl)
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" \
                 python tools/check_base_install.py
      - name: the console script runs from the installed distribution
        run: |
          set -euo pipefail
          wheel=$(ls "$DIST_DIR"/*.whl)
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" wpbackup2 --version
      - name: python -m wpbackup2 runs from the installed distribution
        # AD-22 freezes `python -m wpbackup2` as well as the console script. The
        # step runs outside the checkout, so no on-disk tree can shadow the
        # module the wheel ships.
        run: |
          set -euo pipefail
          wheel=$(realpath "$(ls "$DIST_DIR"/*.whl)")
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" python -m wpbackup2 --version
      - name: every optional extra installs, wheels only, from PyPI
        # FR-25: "every runtime dependency resolves from its declared index at
        # release time". The steps above install the BASE wheel only, so a broken
        # extra would pass them. This one installs every extra (`--all-extras`, so
        # one added later is covered with no edit; `database` is an empty alias
        # since owner decision 76, so it must still resolve, adding nothing) with
        # --no-build, so a dependency that only has an sdist or a git source fails
        # here, not at an operator's install (E004 gate AG-3, 2026-10-28). Then the
        # built wheel itself, --no-deps. The dependencies are read from
        # pyproject.toml, which is what the wheel is built from.
        #
        # WHICH INDEX: PyPI only. pyproject.toml declares no [tool.uv.sources] and
        # no extra index (2026-11-10; the family came from TestPyPI before), so
        # this resolves exactly as an operator's pip install does. A PyPI release
        # runs the same check with --no-sources (publish.yml, smoke). Anonymous,
        # so this runs on pull requests too.
        run: |
          set -euo pipefail
          wheel=$(ls "$DIST_DIR"/*.whl)
          venv="$(mktemp -d)/venv"
          uv venv -q --python "${{ matrix.python }}" "$venv"
          uv pip install --python "$venv" --no-build -r pyproject.toml --all-extras
          uv pip install --python "$venv" --no-deps "$wheel"
          "$venv/bin/python" -c "from l3io.wp import backup, database, config; print('extras install ok')"

  image:
    # The official image's Dockerfile (docker/Dockerfile), built for amd64 from
    # THIS checkout's wheel through its test-only `wheels` context, then the
    # sidecar suite (tests/sidecar/run.sh: one-shot and scheduled modes)
    # against WordPress, so a Dockerfile, entrypoint or s6 breakage fails here
    # and not at release. Nothing is pushed: docker.yml builds the released
    # image from PyPI, multi-arch, and runs the same suite on the pushed digest.
    #
    # Under act the scratch directory lives in the bind-mounted checkout, whose
    # path is the same in the job container and on the host: the compose bind
    # mounts are resolved by the HOST's Docker daemon, so a /tmp path inside the
    # job container would mount an empty host directory.
    name: image · sidecar suite · ${{ matrix.client }} client · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs: [static, contracts]
    strategy:
      fail-fast: false
      matrix:
        # Each image variant (docker/Dockerfile's DB_CLIENT; owner decision 81)
        # on the server families it claims (docs/docker.md): the default
        # (MySQL) client on both, the MariaDB client on MariaDB.
        include:
          - { client: mysql, engine: mysql }
          - { client: mysql, engine: mariadb }
          - { client: mariadb, engine: mariadb }
    env:
      # One directory per leg: the legs run at once, and each removes its own.
      L3IO_SIDECAR_SCRATCH: ${{ vars.LOCAL_ACT && format('{0}/.sidecar-scratch/{1}-{2}', github.workspace, matrix.client, matrix.engine) || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          enable-cache: ${{ !vars.LOCAL_ACT }}
      - name: run tests/sidecar/run.sh (builds the image from this checkout's wheel)
        env:
          ENGINE: ${{ matrix.engine }}
          L3IO_DB_CLIENT: ${{ matrix.client }}
          REMOVE_IMAGE: "1"
          # One image per leg: under act the legs share the host's daemon, and
          # one leg's REMOVE_IMAGE must not remove another's.
          L3IO_IMAGE_SUFFIX: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          if [ -n "$L3IO_SIDECAR_SCRATCH" ]; then mkdir -p "$L3IO_SIDECAR_SCRATCH"; fi
          tests/sidecar/run.sh "$ENGINE"
      - name: remove the scratch directory (act)
        if: ${{ always() && vars.LOCAL_ACT }}
        run: rm -rf "$L3IO_SIDECAR_SCRATCH"
