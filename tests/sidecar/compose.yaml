# LOCAL TEST ONLY -- driven by tests/sidecar/run.sh, which sets every variable
# below and writes the env files (generated throwaway credentials) into a
# scratch directory. Do not `docker compose up` this by hand.
#
# Models the owner's deployment: the official `wordpress` image with its site
# files on a bind mount at /var/www/html and DB_* from WORDPRESS_DB_* through
# the image's getenv_docker() wp-config.php, a separate MySQL or MariaDB
# container on a shared network, and the backup tool as a sidecar sharing both.
#
# Engine: exactly one of the profiles `mysql` (mysql:8.0), `mysql84`
# (mysql:8.4) or `mariadb` (mariadb:11.4). Each carries the network alias `db`.
#
# The sidecar is the product image (docker/Dockerfile), L3IO_SIDECAR_IMAGE:
# built by run.sh from this checkout's wheel, or a published image (IMAGE=).

x-db-common: &db-common
  networks:
    backend:
      aliases: [db]
  volumes:
    - db-data:/var/lib/mysql
    # Test CA and a server certificate for the name `db`: a restore requires
    # verified TLS to any host but localhost (docs/restore.md, --admin-tls).
    - ${L3IO_SCRATCH:?}/tls:/etc/l3io-tls:ro
  command:
    - --ssl-ca=/etc/l3io-tls/ca.pem
    - --ssl-cert=/etc/l3io-tls/server.pem
    - --ssl-key=/etc/l3io-tls/server-key.pem
  env_file: ${L3IO_SCRATCH:?}/db.env

services:
  db-mysql:
    <<: *db-common
    profiles: [mysql]
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 3s
      timeout: 5s
      retries: 60

  db-mysql84:
    <<: *db-common
    profiles: [mysql84]
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 3s
      timeout: 5s
      retries: 60

  db-mariadb:
    <<: *db-common
    profiles: [mariadb]
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60

  wordpress:
    image: wordpress:php8.3-apache@sha256:9001ea7dafd2bc3f05d068e6413b0edd2a116eeed4dfe9e08b6bd718dee4960a
    env_file: ${L3IO_SCRATCH:?}/wp.env
    volumes:
      - ${L3IO_SCRATCH:?}/html:/var/www/html
    networks: [backend]
    depends_on:
      db-mysql: {condition: service_healthy, required: false}
      db-mysql84: {condition: service_healthy, required: false}
      db-mariadb: {condition: service_healthy, required: false}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 2s
      timeout: 3s
      retries: 60

  backup:
    image: ${L3IO_SIDECAR_IMAGE:?}
    init: true
    # The one-shot mode, idling: jobs are `docker compose exec backup wpbackup2
    # ...`. Started as 33:33, so a read-only root filesystem works and `exec`
    # runs as www-data unless a step asks for root (`-u 0`).
    user: "33:33"
    command: ["sleep", "infinity"]
    # The site's WORDPRESS_DB_* (the WordPress container's own file), from which
    # the image's getenv_docker() wp-config.php is resolved (owner decision 47),
    # and the administrator account a database restore needs
    # (L3IO_WP_BACKUP_ADMIN_*).
    env_file:
      - ${L3IO_SCRATCH:?}/wp.env
      - ${L3IO_SCRATCH:?}/backup.env
    volumes:
      - ${L3IO_SCRATCH:?}/html:/var/www/html
      - backups:/backups
      - state:/var/lib/wpbackup/state
      - ${L3IO_SCRATCH:?}/tls/ca.pem:/run/l3io-tls/ca.pem:ro
    tmpfs:
      - /tmp/wpbackup:mode=0700,uid=33,gid=33
    read_only: true
    networks: [backend]
    depends_on:
      wordpress: {condition: service_healthy}

  # The scheduled mode, the image's default (no command): s6 starts Supercronic
  # as PUID:PGID (33:33). Started by run.sh's schedule phase only.
  scheduler:
    profiles: [schedule]
    image: ${L3IO_SIDECAR_IMAGE:?}
    env_file:
      - ${L3IO_SCRATCH:?}/wp.env
      - ${L3IO_SCRATCH:?}/backup.env
      - ${L3IO_SCRATCH:?}/schedule.env
    volumes:
      - ${L3IO_SCRATCH:?}/html:/var/www/html
      - backups:/backups
      - state:/var/lib/wpbackup/state
      - ${L3IO_SCRATCH:?}/crontab:/etc/l3io-wp-backup/crontab:ro
    tmpfs:
      - /tmp/wpbackup:mode=0700,uid=33,gid=33
    networks: [backend]

  # One-shot tools, run with `docker compose run --rm`.
  wpcli:
    profiles: [tools]
    image: wordpress:cli-php8.3@sha256:a4fff017eb08c03187e90fe52d4bff8d3a4d4a5103de05829a6e747c4ca3056e
    user: "33:33"
    env_file: ${L3IO_SCRATCH:?}/wp.env
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - ${L3IO_SCRATCH:?}/html:/var/www/html
      - ${L3IO_SCRATCH:?}/content:/content:ro
    networks: [backend]

  curl:
    profiles: [tools]
    image: curlimages/curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    networks: [backend]

volumes:
  db-data:
  backups:
  state:

networks:
  backend:
    internal: true
